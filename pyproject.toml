[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
# Only collect the unit tests. The repo also has example scripts named *_test.py
# (completebias_test.py, docs/examples/simplebias_test.py) that load gated models
# and open plot windows when imported.
testpaths = ["tests"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["transformers.*", "tqdm.*"]
ignore_missing_imports = true